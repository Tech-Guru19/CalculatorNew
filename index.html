<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-9ndCyUaIbzAi2F+Lw9kF+Lw9HkK5qj7F2tX2M5t5Q5z5A9Z4t8Q8q3t4g3s3h4a6d5d5" crossorigin="anonymous">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .calculator {
            background-color: #2c3e50;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border-radius: 1.5rem;
        }
        .display {
            background-color: #34495e;
            color: white;
            padding: 1.5rem 1rem;
            border-radius: 1rem;
            text-align: right;
            margin-bottom: 1rem;
        }
        .display .previous {
            color: #bdc3c7;
            font-size: 1.25rem;
            min-height: 1.5rem;
        }
        .display .current {
            font-size: 3rem;
            font-weight: 300;
            min-height: 3rem;
            overflow: hidden;
            white-space: nowrap;
        }
        .btn {
            font-weight: bold;
            font-size: 1.5rem;
            padding: 1.2rem 0;
            border-radius: 0.75rem;
            transition: all 0.2s ease-in-out;
            border: none;
        }
        .btn-secondary {
            background-color: #34495e;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #49637c;
            color: white;
        }
        .btn-success {
            background-color: #27ae60;
            color: white;
        }
        .btn-success:hover {
            background-color: #2ecc71;
            color: white;
        }
        .btn-danger {
            background-color: #e74c3c;
            color: white;
        }
        .btn-danger:hover {
            background-color: #c0392b;
            color: white;
        }
        .btn-primary {
            background-color: #3498db;
            color: white;
        }
        .btn-primary:hover {
            background-color: #2980b9;
            color: white;
        }
    </style>
</head>
<body class="bg-dark d-flex align-items-center justify-content-center vh-100 p-3">

    <div class="calculator p-4 rounded-4">

        <div class="display">
            <div id="previous-operand" class="previous"></div>
            <div id="current-operand" class="current">0</div>
        </div>

        <div class="row g-2">
            <div class="col-6"><button class="btn btn-danger w-100" onclick="calculator.clear()">AC</button></div>
            <div class="col-3"><button class="btn btn-secondary w-100" onclick="calculator.delete()">DEL</button></div>
            <div class="col-3"><button class="btn btn-success w-100" onclick="calculator.chooseOperation('/')">/</button></div>

            <div class="col-3"><button class="btn btn-secondary w-100" onclick="calculator.appendNumber('7')">7</button></div>
            <div class="col-3"><button class="btn btn-secondary w-100" onclick="calculator.appendNumber('8')">8</button></div>
            <div class="col-3"><button class="btn btn-secondary w-100" onclick="calculator.appendNumber('9')">9</button></div>
            <div class="col-3"><button class="btn btn-success w-100" onclick="calculator.chooseOperation('*')">×</button></div>

            <div class="col-3"><button class="btn btn-secondary w-100" onclick="calculator.appendNumber('4')">4</button></div>
            <div class="col-3"><button class="btn btn-secondary w-100" onclick="calculator.appendNumber('5')">5</button></div>
            <div class="col-3"><button class="btn btn-secondary w-100" onclick="calculator.appendNumber('6')">6</button></div>
            <div class="col-3"><button class="btn btn-success w-100" onclick="calculator.chooseOperation('-')">−</button></div>

            <div class="col-3"><button class="btn btn-secondary w-100" onclick="calculator.appendNumber('1')">1</button></div>
            <div class="col-3"><button class="btn btn-secondary w-100" onclick="calculator.appendNumber('2')">2</button></div>
            <div class="col-3"><button class="btn btn-secondary w-100" onclick="calculator.appendNumber('3')">3</button></div>
            <div class="col-3"><button class="btn btn-success w-100" onclick="calculator.chooseOperation('+')">+</button></div>

            <div class="col-3"><button class="btn btn-secondary w-100" onclick="calculator.appendNumber('0')">0</button></div>
            <div class="col-3"><button class="btn btn-secondary w-100" onclick="calculator.appendNumber('.')">.</button></div>
            <div class="col-6"><button class="btn btn-primary w-100" onclick="calculator.compute()">=</button></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-yWj8lW42F5r8r8r8r8r8r8r8r8r8r8r8r8r8r8r8r8r8r8r8r8r8r8r8r8r8r8r8r8r" crossorigin="anonymous"></script>

</body>
<script src="script.js"></script>
</html>
